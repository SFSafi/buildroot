name: Build E-Pass Buildroot

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      clean-build:
        description: 'Clean build (clear cache)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            build-essential \
            git \
            bc \
            swig \
            libncurses-dev \
            libpython3-dev \
            libssl-dev \
            mtd-utils \
            python3-setuptools \
            fakeroot \
            cpio \
            rsync \
            cmake \
            file

      - name: Cache download directory
        if: ${{ !inputs.clean-build }}
        uses: actions/cache@v4
        with:
          path: dl
          key: buildroot-dl-${{ hashFiles('package/**/*.mk', 'package/**/*.hash') }}
          restore-keys: |
            buildroot-dl-

      - name: Apply defconfig
        run: make rhodesisland_epass_defconfig

      - name: Build
        run: make -j$(nproc)

      - name: List build artifacts
        run: ls -la output/images/

      - name: Upload U-Boot (NAND SPL)
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-sunxi-with-nand-spl
          path: output/images/u-boot-sunxi-with-nand-spl.bin
          retention-days: 30

      - name: Upload Boot FIT image
        uses: actions/upload-artifact@v4
        with:
          name: boot-fit-image
          path: output/images/boot.itb
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Boot UBI image
        uses: actions/upload-artifact@v4
        with:
          name: boot-ubi-image
          path: output/images/boot_ubi.img
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Rootfs UBI image
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-ubi-image
          path: output/images/rootfs_ubi.img
          retention-days: 30

      - name: Upload Device Tree
        uses: actions/upload-artifact@v4
        with:
          name: device-tree
          path: output/images/*.dtb
          if-no-files-found: ignore
          retention-days: 30
